[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aimagician-backend"
version = "0.1.0"
description = "AImagician self-media operations API and MCP server"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.14,<2",
  "argon2-cffi>=23,<24",
  "cryptography>=42,<47",
  "fastapi>=0.115,<1",
  "mcp[cli]>=1.27,<2",
  "Pillow>=10,<12",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.7,<3",
  "requests>=2.32,<3",
  "SQLAlchemy>=2.0,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8,<9",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
